[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip rp2040"

rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "target-cpu=cortex-m0",
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "info"
