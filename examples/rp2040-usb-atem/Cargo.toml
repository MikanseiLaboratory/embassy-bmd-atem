[package]
name = "rp2040-usb-atem"
description = "RP2040 (Pico) example: ATEM USB 8.6+ host control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
embassy-bmd-atem = { workspace = true }
bmd-atem-atom = { workspace = true }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1"
linked_list_allocator = { version = "0.10.6", default-features = false }

[features]
default = []
# Gate for the actual firmware bin; build with --target thumbv6m-none-eabi.
firmware = []

[[bin]]
name = "rp2040-usb-atem"
path = "src/main.rs"
required-features = ["firmware"]
