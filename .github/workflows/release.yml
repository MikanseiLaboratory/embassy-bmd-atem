name: Release

# Publishes the three crates to crates.io in dependency order and creates a
# GitHub release. Trigger by pushing a tag such as `v0.1.1`, or manually.
#
# Required repository secret:
#   CARGO_REGISTRY_TOKEN — a crates.io API token with publish rights for
#   `bmd-atem-atom`, `embassy-bmd-atem` and `embassy-bmd-atem-std`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify only (cargo publish --dry-run), do not upload"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features embassy-bmd-atem/std -- -D warnings

      - name: Tests
        run: cargo test -p bmd-atem-atom -p embassy-bmd-atem -p embassy-bmd-atem-std --features embassy-bmd-atem/std

      - name: no_std (thumbv6m)
        run: |
          cargo check -p bmd-atem-atom --target thumbv6m-none-eabi
          cargo check -p embassy-bmd-atem --target thumbv6m-none-eabi

      - name: RP2040 firmware example
        run: cargo build -p rp2040-usb-atem --target thumbv6m-none-eabi --features firmware

      - name: Docs
        run: cargo doc --no-deps -p bmd-atem-atom -p embassy-bmd-atem -p embassy-bmd-atem-std --features embassy-bmd-atem/std
        env:
          RUSTDOCFLAGS: -D warnings

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        run: |
          v="$(cargo metadata --no-deps --format-version 1 \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version $v"

      - name: Publish bmd-atem-atom
        run: cargo publish -p bmd-atem-atom --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # crates.io needs a moment before the new crate is resolvable as a
      # dependency of the next one.
      - name: Wait for the index
        run: sleep 45

      - name: Publish embassy-bmd-atem
        run: cargo publish -p embassy-bmd-atem --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for the index
        run: sleep 45

      - name: Publish embassy-bmd-atem-std
        run: cargo publish -p embassy-bmd-atem-std --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published to crates.io:

            - [`bmd-atem-atom ${{ steps.version.outputs.version }}`](https://crates.io/crates/bmd-atem-atom)
            - [`embassy-bmd-atem ${{ steps.version.outputs.version }}`](https://crates.io/crates/embassy-bmd-atem)
            - [`embassy-bmd-atem-std ${{ steps.version.outputs.version }}`](https://crates.io/crates/embassy-bmd-atem-std)

  dry-run:
    name: Dry run
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The dependent crates can only be packaged once their dependencies are
      # on crates.io, so a dry run limits itself to the leaf crate.
      - run: cargo publish -p bmd-atem-atom --dry-run
